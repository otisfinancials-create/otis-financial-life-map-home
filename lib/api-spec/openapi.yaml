                  $ref: "#/components/schemas/SavedScenario"
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Save a scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedScenarioInput"
      responses:
        "201":
          description: Saved scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedScenario"
  /scenarios/{id}:
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found


  /plaid/create-link-token:
    post:
      operationId: createPlaidLinkToken
      tags: [plaid]
      summary: Create a Plaid Link token for the authenticated user
      description: >
        Without a body (or with plaidItemId null), creates a token for linking a NEW bank.
        With plaidItemId, creates an update-mode token with account selection enabled for
        that existing item, so the user can add accounts without re-linking.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaidLinkTokenInput"
      responses:
        "200":
          description: Link token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaidLinkToken"
        "403":
          description: plaidItemId does not belong to the authenticated user
        "502":
          description: Plaid error

  /plaid/exchange-token:
    post:
      operationId: exchangePlaidToken
      tags: [plaid]
      summary: Exchange a public token, store the item, and import accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaidExchangeInput"
      responses:
        "200":
          description: Item linked and accounts imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaidExchangeResult"
        "502":
          description: Plaid error

  /plaid/forecast-accounts:
    put:
      operationId: setPlaidForecastAccounts
      tags: [plaid]
      summary: Set which of a linked item's accounts pay bills (feed the forecast)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaidForecastAccountsInput"
      responses:
        "200":
          description: Selection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaidForecastAccountsResult"
        "404":
          description: Item not found

  /bills/link-review:
    get:
      operationId: getBillLinkReview
      tags: [bills]
      summary: List bills lacking a match_merchant, each with suggested merchants and sample charges
      responses:
        "200":
          description: Bills needing linking with suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillLinkReviewItem"

  /bills/{id}/link-merchant:
    post:
      operationId: linkBillMerchant
      tags: [bills]
      summary: Store match_merchant on a bill and immediately re-run matching on its card's open cycles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillLinkMerchantInput"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Not found

  /bills/account-merchants:
    get:
      operationId: listAccountMerchants
      tags: [bills]
      summary: Distinct real merchants from posted charges on an account, for exact match_merchant picking
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Real merchants (most recent/frequent first). Empty for manual accounts with no synced charges.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountMerchant"
        "404":
          description: Account not found

  /bills/suggest-merchants:
    post:
      operationId: suggestBillMerchants
      tags: [bills]
      summary: Suggest likely merchants for a (possibly unsaved) bill from its paying account's recent charges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillMerchantSuggestInput"
      responses:
        "200":
          description: Ranked merchant candidates (merchant-name plausibility first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillLinkCandidate"

  /bills/{id}/matching-charges:
    get:
      operationId: getBillMatchingCharges
      tags: [bills]
      summary: Recent charges currently allocated to this bill's line in its card's cycles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Charges currently matched to the bill (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillLinkSample"
        "404":
          description: Not found

  /bills/detect:
    post:
      operationId: detectBills
      tags: [bills]
      summary: Run smart bill detection over synced Plaid transactions
      responses:
        "200":
          description: Detection run summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillDetectionSummary"

  /bills/detected:
    get:
      operationId: listDetectedBills
      tags: [bills]
      summary: List pending/duplicate detected bills, highest confidence first
      responses:
        "200":
          description: Detected bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DetectedBill"

  /bills/detected-drafts:
    get:
      operationId: listDetectedBillDrafts
      tags: [bills]
      summary: Pending detections enriched into pre-filled, pre-linked bill drafts
      responses:
        "200":
          description: Draft bills, highest confidence first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DetectedBillDraft"

  /bills/detected-new-count:
    get:
      operationId: getDetectedNewBillCount
      tags: [bills]
      summary: Count of pending detections the user has not yet seen
      responses:
        "200":
          description: Unseen pending detection count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer

  /bills/detected/mark-seen:
    post:
      operationId: markDetectedBillsSeen
      tags: [bills]
      summary: Mark all pending detections as seen (stops the new-bill notification)
      responses:
        "200":
          description: Number of detections marked seen
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked:
                    type: integer

  /bills/detected/{id}/confirm:
    post:
      operationId: confirmDetectedBill
      tags: [bills]
      summary: Confirm a detected bill and create a real bill from it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDetectedBillInput"
      responses:
        "200":
          description: Bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Not found
        "409":
          description: Already confirmed or dismissed

  /bills/detected/{id}/dismiss:
    post:
      operationId: dismissDetectedBill
      tags: [bills]
      summary: Dismiss a detected bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectedBill"
        "404":
          description: Not found

  /forecast/calendar:
    get:
      operationId: getForecastCalendar
      tags: [forecast]
      summary: Hybrid month calendar — per-day events, net cash change, and rolled end-of-day balance
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Calendar data for the requested month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastCalendarResponse"

  /plaid/items/{id}/remove:
    post:
      operationId: removePlaidItem
      tags: [plaid]
      summary: Remove a Plaid Item — revokes it at Plaid and deletes local item data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removal result (idempotent — removed=false when the item was already gone)
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: boolean
        "502":
          description: Plaid rejected the removal; nothing was deleted locally

  /plaid/items/{id}/refresh-accounts:
    post:
      operationId: refreshPlaidItemAccounts
      tags: [plaid]
      summary: Re-fetch an existing item's accounts after an update-mode Link session and reconcile them
      description: >
        Does NOT exchange a public token or create a plaid_items row — update mode keeps the
        existing access token valid. Reconciles by plaid_account_id: known accounts are updated
        in place (accounts.id unchanged), new ones are inserted with isForecastAccount=false,
        and rows no longer returned by Plaid are unlinked (kept as manual accounts) because
        bills and card cycles may reference them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reconciliation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaidRefreshAccountsResult"
        "404":
          description: Item not found for this user
        "502":
          description: Plaid error

  /plaid/sync:
    post:
      operationId: syncPlaidTransactions
      tags: [plaid]
      summary: Sync transactions from Plaid for all connected items of the authenticated user
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaidSyncResult"
        "502":
          description: Plaid error

  /plaid/transactions:
    get:
      operationId: listPlaidTransactions
      tags: [plaid]
      summary: List synced Plaid transactions for the authenticated user (most recent first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaidTransaction"

  /plaid/webhook:
    post:
      operationId: plaidWebhook
      tags: [plaid]
      summary: "Public Plaid webhook receiver (no auth: identified by Plaid item_id)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaidWebhookInput"
      responses:
        "200":
          description: Acknowledged

  /plaid/disconnect:
    post:
      operationId: disconnectPlaidAccount
      tags: [plaid]
      summary: Disconnect an account from Plaid but keep it as a manual account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaidDisconnectInput"
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaidDisconnectResult"
        "404":
          description: Account not found

