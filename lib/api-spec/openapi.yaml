          type: ["string", "null"]

    AccountMerchant:
      type: object
      required: [merchant, displayName, occurrences, typicalAmount, lastDate]
      properties:
        merchant:
          type: string
          description: Normalized merchant key (exact value to store as match_merchant)
        displayName:
          type: string
        occurrences:
          type: integer
        typicalAmount:
          type: number
        lastDate:
          type: string

    BillMerchantSuggestInput:
      type: object
      required: [billName, amount, paymentAccountId]
      properties:
        billName:
          type: string
        amount:
          type: number
        frequency:
          type: string
        paymentAccountId:
          type: integer
        companyUrl:
          type: ["string", "null"]


    Goal:
      type: object
      required:
        [
          id,
          name,
          goalType,
          targetAmount,
          alreadySaved,
          startDate,
          targetDate,
          sourceAccountId,
          destinationAccountId,
          contributionDay,
          monthlyContribution,
          status,
          isActive,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        goalType:
          type: string
          enum: [spend, accumulation]
        targetAmount:
          type: number
        alreadySaved:
          type: number
        startDate:
          type: string
        targetDate:
          type: string
        sourceAccountId:
          type: integer
        destinationAccountId:
          type: integer
        contributionDay:
          type: integer
        monthlyContribution:
          type: number
        status:
          type: string
          enum: [draft, committed, completed, cancelled]
        billId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        actualBucket:
          type: number
          description: Stored ACTUAL bucket — alreadySaved + reconciled contributions − withdrawals. Progress-bar number; nothing consumes it yet.
        projectedBucketAtSpendDate:
          type: ["number", "null"]
          description: Spend goals only — alreadySaved + scheduled contributions ≤ target date. Used for purchase netting.
        shortfall:
          type: ["number", "null"]
          description: Spend goals only — max(0, targetAmount − projected bucket at the spend date). The net balance effect of the purchase.
        targetReachedEarly:
          type: boolean
          description: §7.7 — actual bucket reached the target before the target date while future contributions are still scheduled. UI should prompt to stop contributing.
        bucketInvariant:
          type: ["object", "null"]
          description: Invariant check — stored actual bucket must equal alreadySaved + reconciled contributions − withdrawals.
          required: [stored, derived, ok]
          properties:
            stored:
              type: number
            derived:
              type: number
            ok:
              type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    GoalInput:
      type: object
      required:
        [name, goalType, targetAmount, startDate, targetDate, sourceAccountId, destinationAccountId, contributionDay]
      properties:
        name:
          type: string
        goalType:
          type: string
          enum: [spend, accumulation]
        targetAmount:
          type: number
        alreadySaved:
          type: number
        startDate:
          type: string
        targetDate:
          type: string
        sourceAccountId:
          type: integer
        destinationAccountId:
          type: integer
        contributionDay:
          type: integer
          minimum: 1
          maximum: 31

    GoalSurplus:
      type: object
      description: >
        One computation, two presentations. availableMonthly answers "can I
        afford one more goal?" (committed goal contributions already
        subtracted). grossMonthly answers "do my goals fit my income?"
        (contributions added back). Derived from the forecast ledger with the
        signedF convention — parent card rows only, goal purchase/funding legs
        and asset movements excluded. leakageMonthly is a diagnostic only and
        is never folded into surplus.
      required:
        [windowStart, windowEnd, availableMonthly, grossMonthly, committedMonthlyTotal, leakageMonthly, months, committedGoals]
      properties:
        windowStart:
          type: string
        windowEnd:
          type: string
        availableMonthly:
          type: number
          description: Mean monthly net over the window, AFTER committed goal contributions.
        grossMonthly:
          type: number
          description: availableMonthly + mean monthly committed goal contributions in the window.
        committedMonthlyTotal:
          type: number
          description: Sum of committed goals' current monthly contributions.
        leakageMonthly:
          type: number
          description: Trailing-6-complete-month average of non-card, non-bill, non-transfer checking outflows. Diagnostic only.
        months:
          type: array
          items:
            type: object
            required: [month, available, gross]
            properties:
              month:
                type: string
              available:
                type: number
              gross:
                type: number
        committedGoals:
          type: array
          items:
            type: object
            required: [goalId, name, monthlyContribution]
            properties:
              goalId:
                type: integer
              name:
                type: string
              monthlyContribution:
                type: number

    GoalUpdate:
      type: object
      properties:
        name:
          type: string
        goalType:
          type: string
          enum: [spend, accumulation]
        targetAmount:
          type: number
        alreadySaved:
          type: number
        startDate:
          type: string
        targetDate:
          type: string
        sourceAccountId:
          type: integer
        destinationAccountId:
          type: integer
        contributionDay:
          type: integer
          minimum: 1
          maximum: 31
        isActive:
          type: boolean



    UpcomingBill:
      type: object
      required: [id, billName, category, amount, dueDate, daysUntilDue]
      properties:
        id:
          type: integer
        billName:
          type: string
        category:
          type: string
        amount:
          type: number
        dueDate:
          type: string
        daysUntilDue:
          type: integer
        paymentMethod:
