            type: object
            required: [date, name, amount]
            properties:
              date:
                type: string
              name:
                type: string
              amount:
                type: number

    ConfirmDetectedBillInput:
      type: object
      description: Optional overrides applied when confirming a detected bill
      properties:
        billName:
          type: string
        category:
          type: string
        amount:
          type: number
        frequency:
          type: string
          enum: [weekly, biweekly, monthly, quarterly, annually]
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
        paymentAccountId:
          type: ["integer", "null"]
        matchMerchant:
          type: ["string", "null"]

    PlaidWebhookInput:
      type: object
      properties:
        webhook_type:
          type: string
        webhook_code:
          type: string
        item_id:
          type: string
      additionalProperties: true

    PlaidSyncResult:
      type: object
      required: [added, modified, removed, balancesCaptured, lastSyncedAt]
      properties:
        added:
          type: integer
        modified:
          type: integer
        removed:
          type: integer
        balancesCaptured:
          type: integer
        lastSyncedAt:
          type: string
          nullable: true

    AccountBalanceSnapshot:
      type: object
      required: [accountId, snapshotDate, current, available, creditLimit, currencyCode, capturedAt]
      properties:
        accountId:
