  # ── Saved Scenarios ─────────────────────────────────────────────────────────
  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List saved scenarios
      responses:
        "200":
          description: List of saved scenarios
          content:
            application/json:
              schema:
                type: array
