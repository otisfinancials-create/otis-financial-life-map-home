      type: object
      required: [publicToken]
      properties:
        publicToken:
          type: string
        institutionId:
          type: ["string", "null"]
        institutionName:
          type: ["string", "null"]

    PlaidExchangeResult:
      type: object
      required: [success, itemId, institutionName, accountsAdded, accounts]
      properties:
        success:
          type: boolean
        itemId:
          type: integer
          description: Internal plaid_items row id (never the Plaid access token)
        institutionName:
          type: string
        accountsAdded:
          type: integer
        accounts:
          type: array
          description: This item's imported accounts, for the connect-time "which accounts do you pay bills from?" selection step
          items:
            $ref: "#/components/schemas/PlaidLinkedAccount"

    PlaidLinkedAccount:
      type: object
      required: [id, accountName, accountType, accountNumberLast4, isForecastAccount]
      properties:
        id:
          type: integer
        accountName:
          type: string
        accountType:
          type: string
        accountNumberLast4:
          type: ["string", "null"]
        isForecastAccount:
          type: boolean

    PlaidForecastAccountsInput:
      type: object
      required: [itemId, selectedAccountIds, presentedAccountIds]
      properties:
        itemId:
          type: integer
          description: Internal plaid_items row id whose accounts are being configured
        selectedAccountIds:
          type: array
          items:
            type: integer
          description: Account ids (from this item) the user pays bills from. Must be a subset of presentedAccountIds.
        presentedAccountIds:
          type: array
          items:
            type: integer
          description: >
            Account ids that were actually shown in the selection dialog. The save is
            scoped to exactly these accounts — presented+selected → true,
            presented+unselected → false. Accounts of the item NOT in this list are
            left completely untouched (update-mode dialogs only present newly added
            accounts; existing selections must survive).

    PlaidForecastAccountsResult:
      type: object
      required: [updated, accounts]
      properties:
        updated:
          type: integer
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/PlaidLinkedAccount"

    PlaidLinkTokenInput:
      type: object
      properties:
        plaidItemId:
          type: ["integer", "null"]
          description: Internal plaid_items row id. When set, the token is created in update mode with account selection for that item.

    PlaidRefreshAccountsResult:
      type: object
      required: [success, itemId, institutionName, accountsAdded, accountsUnlinked, newAccounts, unlinkedAccounts]
      properties:
        success:
          type: boolean
        itemId:
          type: integer
          description: Internal plaid_items row id (unchanged — update mode never creates a new item)
        institutionName:
          type: string
        accountsAdded:
          type: integer
        accountsUnlinked:
          type: integer
          description: Accounts no longer returned by Plaid, kept locally as manual accounts
        newAccounts:
          type: array
          description: Only the accounts added by this update-mode session, for the "which accounts do you pay bills from?" selection step
          items:
            $ref: "#/components/schemas/PlaidLinkedAccount"
        unlinkedAccounts:
          type: array
          description: >
            Accounts unlinked by this session (kept locally as manual accounts).
            isForecastAccount reflects the PRE-unlink value — unlinking always resets
            the stored flag to false, so a true here means the forecast just lost
            this account's basis.
          items:
            $ref: "#/components/schemas/PlaidLinkedAccount"

