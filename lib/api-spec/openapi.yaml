    # ── Forecasted Transactions ───────────────────────────────────────────────
    ForecastedTransaction:
      type: object
      required: [id, transactionDate, description, amount, transactionType, category, isCcParent, isActual, isCommitted, sortOrder, createdAt]
      properties:
        id:
          type: integer
        transactionDate:
          type: string
        description:
          type: string
        amount:
          type: number
        transactionType:
          type: string
        category:
          type: string
        sourceBillId:
          type: ["integer", "null"]
        sourcePayId:
          type: ["integer", "null"]
        sourceLifeEventId:
          type: ["integer", "null"]
        sourceBalanceSyncId:
          type: ["integer", "null"]
        sourceGoalId:
          type: ["integer", "null"]
          description: Spend-goal purchase pair — funding inflow + purchase expense both carry the goal id so they regenerate and are removed together
        ccAccountId:
          type: ["integer", "null"]
          description: Credit-card account this row belongs to (CC billing cycle grouping)
        isCcParent:
          type: boolean
          description: True for the "Credit Card Payment" parent row of a CC group
        sourceCardCycleId:
          type: ["integer", "null"]
          description: When set, this row is a card cycle's due-date payment (no child rows)
        ccBasis:
          type: ["string", "null"]
          enum: [actual, projected, null]
          description: How a cycle payment amount was determined — 'actual' (closed cycle) or 'projected' (open cycle, max of accumulated and planned)
        isActual:
          type: boolean
        isCommitted:
          type: boolean
        status:
          type: ["string", "null"]
          description: "'missed' = past bill marked as not paid (excluded from running balance)"
        notes:
          type: ["string", "null"]
        forecastedAmount:
          type: ["number", "null"]
          description: Original planned amount, kept when the user confirms a different actual amount
        matchedPlaidTransactionId:
          type: ["integer", "null"]
          description: Posted bank transaction confirmed as this bill's payment (P6 reconciliation)
        isUnplanned:
          type: boolean
          description: Derived actual row from unmatched posted bank activity (day+category bucket); rebuilt on sync, not editable
        isAssetMovement:
          type: boolean
          description: Money moving between the user's own accounts (savings/investment/account transfers) — steps the balance but is excluded from spending totals
        forecastedDate:
          type: ["string", "null"]
          description: Original planned date, kept when the row moved to the actual posted date
        sortOrder:
          type: integer
        createdAt:
          type: string

    ReconcileCandidateTxn:
      type: object
      required: [plaidTransactionId, actualDate, actualAmount, postedName, pending]
      properties:
        plaidTransactionId:
          type: integer
        actualDate:
          type: string
        actualAmount:
          type: number
        postedName:
          type: string
        pending:
