        snapshotDate:
          type: string
        current:
          type: number
          nullable: true
        available:
          type: number
          nullable: true
        creditLimit:
          type: number
          nullable: true
        currencyCode:
          type: string
          nullable: true
        capturedAt:
          type: string

    PlaidTransaction:
      type: object
