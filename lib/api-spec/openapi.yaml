openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Otis Financial Life Map API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bills
    description: Bill management
  - name: paySchedules
    description: Pay schedule management
  - name: accounts
    description: Account management
  - name: assets
    description: Assets and liabilities management
  - name: forecasts
    description: Cash flow forecasting
  - name: dashboard
    description: Dashboard summaries
  - name: otis
    description: Otis AI advisor and scenario engine
  - name: scenarios
    description: Saved what-if scenarios
  - name: userSettings
    description: User preferences and settings
  - name: retirement
    description: Retirement planning and projections
  - name: plaid
    description: Plaid bank connection

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary (net worth, cash flow, upcoming bills)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── Bills ───────────────────────────────────────────────────────────────────
  /bills:
    get:
      operationId: listBills
      tags: [bills]
      summary: List all bills
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"
    post:
      operationId: createBill
      tags: [bills]
      summary: Create a bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/upcoming:
    get:
      operationId: getUpcomingBills
      tags: [bills]
      summary: Get bills due in the next 30 days
      responses:
        "200":
          description: Upcoming bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingBill"

  /bills/{id}:
    get:
      operationId: getBill
      tags: [bills]
      summary: Get a bill by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Not found
    patch:
      operationId: updateBill
      tags: [bills]
      summary: Update a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Not found
    delete:
      operationId: deleteBill
      tags: [bills]
      summary: Delete a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Goals ─────────────────────────────────────────────────────────────────
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal (draft — zero forecast impact)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Validation failed (e.g. destination inside the forecast pool)

  /goals/surplus:
    get:
      operationId: getGoalSurplus
      tags: [goals]
      summary: Monthly surplus derived from the forecast ledger — available (after committed goal contributions) and gross (before them)
      responses:
        "200":
          description: Surplus summary over the next 12 full forecast months
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalSurplus"

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal (recomputes contribution; forward-only if committed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a draft goal (committed goals must be uncommitted first)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /goals/{id}/commit:
    post:
      operationId: commitGoal
      tags: [goals]
      summary: Commit a goal — creates its monthly contribution bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found

  /goals/{id}/uncommit:
    post:
      operationId: uncommitGoal
      tags: [goals]
      summary: Uncommit a goal — removes or end-dates its contribution bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Uncommitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found

  /goals/{id}/stop-contributions:
    post:
      operationId: stopGoalContributions
      tags: [goals]
      summary: Stop contributing — end-dates the contribution bill at today; reconciled history survives (§7.7 target-reached-early)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contributions stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Goal has no active contribution bill
        "404":
          description: Not found

  /goals/{id}/purchase-removed:
    post:
      operationId: removeGoalPurchase
      tags: [goals]
      summary: Mark a committed spend goal's purchase as "didn't happen" — both purchase rows get status=removed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase marked removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found

  # ── Pay Schedules ─────────────────────────────────────────────────────────
  /pay-schedules:
    get:
      operationId: listPaySchedules
      tags: [paySchedules]
      summary: List all pay schedules
      responses:
        "200":
          description: List of pay schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaySchedule"
    post:
      operationId: createPaySchedule
      tags: [paySchedules]
      summary: Create a pay schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaySchedule"

  /pay-schedules/{id}:
    get:
      operationId: getPaySchedule
      tags: [paySchedules]
      summary: Get a pay schedule by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pay schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaySchedule"
        "404":
          description: Not found
    patch:
      operationId: updatePaySchedule
      tags: [paySchedules]
      summary: Update a pay schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayScheduleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaySchedule"
        "404":
          description: Not found
    delete:
      operationId: deletePaySchedule
      tags: [paySchedules]
      summary: Delete a pay schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Accounts ──────────────────────────────────────────────────────────────
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /accounts/summary:
    get:
      operationId: getAccountsSummary
      tags: [accounts]
      summary: Get net worth and breakdown by account type
      responses:
        "200":
          description: Accounts summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsSummary"

  /accounts/balances:
    get:
      operationId: listAccountBalances
      tags: [accounts]
      summary: Latest daily balance snapshot per connected account (from transactionsSync captures)
      responses:
        "200":
          description: Latest balance snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountBalanceSnapshot"

  /account-goals:
    get:
      operationId: listAccountGoals
      tags: [accounts]
      summary: List savings goals for the user's accounts
      responses:
        "200":
          description: Account goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountGoal"

  /account-goals/{accountId}:
    put:
      operationId: setAccountGoal
      tags: [accounts]
      summary: Set or clear the savings goal for an account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountGoalInput"
      responses:
        "200":
          description: Updated goal (goalAmount null when cleared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountGoal"

  /savings/summary:
    get:
      operationId: getSavingsSummary
      tags: [accounts]
      summary: Savings & investments totals with month-over-month change
      responses:
        "200":
          description: Savings summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsSummary"

  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get an account by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Not found
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Not found
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /accounts/{id}/cycle-config:
    patch:
      operationId: updateAccountCycleConfig
      tags: [accounts]
      summary: Set a card's statement/due days and regenerate its cycles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleConfigInput"
      responses:
        "200":
          description: Generated cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardCycle"
        "404":
          description: Not found

  /accounts/{id}/cycles:
    get:
      operationId: listAccountCycles
      tags: [accounts]
      summary: List a card's cycles ordered by cycle start
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Card cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardCycle"
        "404":
          description: Not found

  /accounts/{id}/generate-cycles:
    post:
      operationId: generateAccountCycles
      tags: [accounts]
      summary: Manually trigger cycle generation for a card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardCycle"
        "404":
          description: Not found

  /cycles/{cycleId}/envelopes:
    get:
      operationId: listCycleEnvelopes
      tags: [envelopes]
      summary: List a cycle's envelopes (food first, misc catch-all last)
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Envelopes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Envelope"
        "404":
          description: Not found
    post:
      operationId: createCycleEnvelope
      tags: [envelopes]
      summary: Create an envelope in a cycle (optionally in all future cycles)
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeInput"
      responses:
        "201":
          description: Created (the envelope in the requested cycle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Not found

  /cycles/{cycleId}/process:
    post:
      operationId: processCycle
      tags: [envelopes]
      summary: Process a cycle — populate bills, allocate posted charges, recompute envelope spent, roll up totals
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Processing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessCycleSummary"
        "404":
          description: Not found

  /cycles/{cycleId}/close:
    post:
      operationId: closeCycle
      tags: [envelopes]
      summary: Mark a cycle closed (only if past its cycle_end) and generate the Food carryover envelope in the next cycle
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Close result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseCycleResult"
        "400":
          description: Cycle is not past its cycle_end yet
        "404":
          description: Not found

  /card-compositions:
    get:
      operationId: listCardCompositions
      tags: [envelopes]
      summary: Read-only per-card cycle compositions (envelopes + allocated bills) for the signed-in user, optionally filtered by due-date range
      parameters:
        - name: dueStart
          in: query
          required: false
          schema:
            type: string
          description: Include only cycles with dueDate >= this YYYY-MM-DD
        - name: dueEnd
          in: query
          required: false
          schema:
            type: string
          description: Include only cycles with dueDate <= this YYYY-MM-DD
      responses:
        "200":
          description: Card compositions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardComposition"

  /cycles/{cycleId}/breakdown:
    get:
      operationId: getCycleBreakdown
      tags: [envelopes]
      summary: Read-only composition of a cycle's payment — its envelopes and bills with amounts
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cycle breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleBreakdown"
        "404":
          description: Not found

  /cycles/{cycleId}/charges:
    get:
      operationId: listCycleCharges
      tags: [envelopes]
      summary: List manual charges (allocations with source='manual') for a cycle
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Manual charges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualCharge"
        "404":
          description: Not found
    post:
      operationId: createCycleCharge
      tags: [envelopes]
      summary: Record a manual card charge against an envelope or a cycle bill
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualChargeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualCharge"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /charges/{id}:
    patch:
      operationId: updateCycleCharge
      tags: [envelopes]
      summary: Edit a manual charge (auto allocations cannot be edited)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualChargeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualCharge"
        "400":
          description: Invalid input or not a manual charge
        "404":
          description: Not found
    delete:
      operationId: deleteCycleCharge
      tags: [envelopes]
      summary: Delete a manual charge (auto allocations cannot be deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Not a manual charge
        "404":
          description: Not found

  /envelopes/{id}:
    patch:
      operationId: updateEnvelope
      tags: [envelopes]
      summary: Update an envelope
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Not found
    delete:
      operationId: deleteEnvelope
      tags: [envelopes]
      summary: Delete an envelope (the catch-all cannot be deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Catch-all envelope cannot be deleted
        "404":
          description: Not found

  # ── Assets & Liabilities ──────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all assets and liabilities
      responses:
        "200":
          description: List of assets and liabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create an asset or liability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/summary:
    get:
      operationId: getAssetsSummary
      tags: [assets]
      summary: Get net worth and breakdown by asset type
      responses:
        "200":
          description: Assets summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetsSummary"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get an asset or liability by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset or liability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete an asset or liability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Loans ─────────────────────────────────────────────────────────────────
  /loans:
    get:
      operationId: listLoans
      tags: [loans]
      summary: List all loans
      responses:
        "200":
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
    post:
      operationId: createLoan
      tags: [loans]
      summary: Create a loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
