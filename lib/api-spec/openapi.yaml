  # ── Forecasted Transactions ──────────────────────────────────────────────
  /forecast:
    get:
      operationId: listForecast
      tags: [forecasts]
      summary: List forecasted transactions (optionally filtered by date range)
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of forecasted transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForecastedTransaction"
    post:
      operationId: createForecastedTransaction
      tags: [forecasts]
      summary: Create a manual forecasted transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastedTransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastedTransaction"

  /forecast/monthly:
    get:
      operationId: getMonthlyForecast
      tags: [forecasts]
      summary: Get monthly cash flow forecast grouped by month (next 12 months)
      responses:
        "200":
          description: Monthly forecast
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyForecast"

  /forecast/regenerate:
    post:
      operationId: regenerateForecast
      tags: [forecasts]
      summary: Regenerate forecasted transactions from bills and pay schedules
      responses:
        "200":
          description: Regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateForecastResult"

  /forecast/sync-balance:
    post:
      operationId: syncBalance
      tags: [forecasts]
      summary: Reconcile the forecasted running balance against the actual bank balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncBalanceInput"
      responses:
        "201":
          description: Balance synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSync"
        "400":
          description: Invalid input

  /forecast/balance-syncs:
    get:
      operationId: listBalanceSyncs
      tags: [forecasts]
      summary: List balance sync history (most recent first)
      responses:
        "200":
          description: Balance sync history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceSync"

  /forecast/reorder:
    post:
      operationId: reorderForecast
      tags: [forecasts]
      summary: Persist a new manual ordering for a set of same-date transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderForecastInput"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderForecastResult"

  /forecast/anchor:
    post:
      operationId: anchorForecast
      description: Returns 409 with code NO_FORECAST_ACCOUNTS when the user has linked cash accounts but none selected for the forecast.
      tags: [forecasts]
      summary: Set the forecast start date and reconstruct the anchor balance as of that date (preview or save)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnchorForecastInput"
      responses:
        "200":
          description: Anchor computed (and saved unless preview)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchorForecastResult"
        "400":
          description: Invalid input

  /forecast/reconcile-candidates:
    get:
      operationId: listReconcileCandidates
      tags: [forecasts]
      summary: List planned bank-paid bill/paycheck rows with matching posted transactions (reconciliation suggestions; multiple candidates = user chooses)
      responses:
        "200":
          description: Reconciliation suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReconcileSuggestion"

  /forecast/{id}/reconcile:
    post:
      operationId: reconcileForecastedTransaction
      tags: [forecasts]
      summary: Confirm a matched posted transaction as this planned bill's payment (moves the row to the actual date/amount)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileForecastInput"
      responses:
        "200":
          description: Reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastedTransaction"
        "400":
          description: Invalid input or row not reconcilable
        "404":
          description: Not found

  /forecast/{id}/unreconcile:
    post:
      operationId: unreconcileForecastedTransaction
      tags: [forecasts]
      summary: Revert a confirmed reconciliation back to the planned date/amount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reverted to planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastedTransaction"
        "400":
          description: Row is not reconciled
        "404":
          description: Not found

  /forecast/{id}/didnt-happen:
    post:
      operationId: markForecastedTransactionDidntHappen
      tags: [forecasts]
      summary: Remove a past planned row the user asserts never occurred (stops stepping the balance; survives regeneration)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed from the ledger
        "400":
          description: Row is confirmed or not a planned row
        "404":
          description: Not found

  /forecast/{id}/dismiss-match:
    post:
      operationId: dismissReconcileMatch
      tags: [forecasts]
      summary: Reject a suggested transaction match for this bill row (never re-suggested)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileForecastInput"
      responses:
        "204":
          description: Dismissed
        "404":
          description: Not found

  /forecast/{id}:
    patch:
      operationId: updateForecastedTransaction
      tags: [forecasts]
      summary: Update a forecasted transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastedTransactionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastedTransaction"
        "404":
          description: Not found
    delete:
      operationId: deleteForecastedTransaction
      tags: [forecasts]
      summary: Delete a forecasted transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── User Settings ────────────────────────────────────────────────────────────
