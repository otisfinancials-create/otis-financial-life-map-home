    BillInput:
      type: object
      required: [billName, category, amount, frequency, dueDay]
      properties:
        billName:
          type: string
        category:
          type: string
        amount:
          type: number
        frequency:
          type: string
        customIntervalDays:
          type: ["integer", "null"]
        dueDay:
          type: integer
        amountType:
          type: string
