          nullable: true
        merchantName:
          type: string
          nullable: true
        category:
          type: array
          items:
            type: string
          nullable: true
        personalFinanceCategory:
          type: string
          nullable: true
        personalFinanceCategoryDetailed:
          type: string
          nullable: true
        paymentChannel:
          type: string
          nullable: true
        pending:
